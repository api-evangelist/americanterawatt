description: 'American Terawatt is an emerging energy infrastructure company focused on building a national high‑voltage direct current (HVDC) transmission network to serve large industrial loads. The firm aims to deliver up to 14 GW of capacity by 2030, leveraging multi‑terminal DC‑to‑DC technology. Based in San Francisco, the team includes engineers and founders from leading tech and finance firms, positioning itself to modernize America’s grid and support industrial growth.'
